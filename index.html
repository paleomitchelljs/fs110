<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sauropod Neck Posture</title>
<meta name="description" content="Drag a sauropod's head, heart and body and watch blood pressure, heart size and energy cost respond.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1 class="sr-only">Sauropod neck posture</h1>
<header class="bar">
  <select id="preset" aria-label="Animal"></select>
  <div class="layers" role="toolbar" aria-label="Layers">
    <button type="button" data-layer="dh" title="Head above heart (1)" aria-label="Head above heart"><svg viewBox="0 0 24 24"><path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/></svg><i>1</i></button>
    <button type="button" data-layer="pressure" title="Blood pressure (2)" aria-label="Blood pressure"><svg viewBox="0 0 24 24"><path d="M4 17a8 8 0 0 1 16 0"/><path d="M12 17l4.5-6"/></svg><i>2</i></button>
    <button type="button" data-layer="walls" title="Artery walls (3)" aria-label="Artery walls"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" stroke-width="4"/></svg><i>3</i></button>
    <button type="button" data-layer="heart" title="Heart size and rate (4)" aria-label="Heart size and rate"><svg viewBox="0 0 24 24"><path d="M12 20C4 14 3 10 5 7.5s5-2 7 1c2-3 5-3.5 7-1s1 6.5-7 12.5z"/></svg><i>4</i></button>
    <button type="button" data-layer="energy" title="Energy cost and reach (5)" aria-label="Energy cost and reach"><svg viewBox="0 0 24 24"><path d="M13 2 5 14h6l-1 8 8-12h-6z"/></svg><i>5</i></button>
    <button type="button" data-layer="siphon" title="Siphon (6)" aria-label="Siphon"><svg viewBox="0 0 24 24"><path d="M6 21V10a6 6 0 0 1 12 0v11"/></svg><i>6</i></button>
    <button type="button" data-layer="pumps" title="Pumps in the neck (7): click the neck to add one" aria-label="Pumps in the neck"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="5"/><path d="M12 2v6M9 5l3-3 3 3M12 18v4"/></svg><i>7</i></button>
    <button type="button" data-layer="air" title="Air sacs (8)" aria-label="Air sacs"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><circle cx="15.5" cy="8" r="2.8"/><circle cx="17" cy="16.5" r="2"/></svg><i>8</i></button>
    <button type="button" data-layer="bones" title="Bones and cartilage (9)" aria-label="Bones and cartilage"><svg viewBox="0 0 24 24"><path d="M5 9.5h14v5H5z"/><path d="M9 9.5V5h6v4.5M9 14.5V19h6v-4.5"/></svg><i>9</i></button>
    <button type="button" data-layer="brain" title="Brain pressure, live (0): double-click the head to drink" aria-label="Brain pressure, live"><svg viewBox="0 0 24 24"><path d="M2 13h4l2.5-7 4.5 13 2.5-6H22"/></svg><i>0</i></button>
  </div>
  <div class="tools">
    <button type="button" id="predict" title="Hide answers until clicked (P)" aria-label="Hide answers"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 20 20 4"/></svg></button>
    <button type="button" id="theme" title="Whiteboard / chalkboard (T)" aria-label="Chalkboard"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="solid"/></svg></button>
    <button type="button" id="reset" title="Start over (click twice)" aria-label="Start over"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 3.5v4h4"/></svg></button>
    <button type="button" id="help" title="What can I drag?" aria-label="Help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg></button>
  </div>
</header>

<main class="stage"><svg id="dia" role="img" aria-label="Sauropod diagram"></svg></main>

<div id="helpbox" class="helpbox" hidden>
  <dl>
    <dt>head</dt><dd>drag · double-click: drink</dd>
    <dt>neck</dt><dd>drag: angle</dd>
    <dt>body</dt><dd>drag ↕: size</dd>
    <dt>front foot</dt><dd>drag ↑: rear</dd>
    <dt>heart</dt><dd>drag ↕ · click: faster · shift: slower</dd>
    <dt><u>numbers</u></dt><dd>drag or scroll</dd>
    <dt>?</dt><dd>click to reveal</dd>
    <dt>1–0</dt><dd>layers</dd>
  </dl>
</div>

<noscript><p class="noscript">This page needs JavaScript.</p></noscript>
<script src="js/model.js"></script>
<script src="js/view.js"></script>
<script src="js/app.js"></script>
</body>
</html>
