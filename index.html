<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FS110</title>
<meta name="description" content="Class tools for FS110: Reasoning from Bones, and a sauropod neck-posture model.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  /* Whiteboard (light) and chalkboard (dark), the same tokens as the tools. */
  :root {
    --ground: #e8edea; --board: #f9fbfa; --card: #ffffff;
    --ink: #17211d; --ink-2: #44514c; --muted: #62706a; --rule: #cfd8d3; --accent-ink: #8a6100;
    --far: #8c9692;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #141e1a; --board: #1b2823; --card: #24352e;
      --ink: #edece3; --ink-2: #c4c9c0; --muted: #919d97; --rule: #34463e; --accent-ink: #f5d76e;
      --far: #6f7c76;
      color-scheme: dark;
    }
    .ink-img { filter: invert(0.92); }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
    background: var(--board); color: var(--ink); font: 18px/1.4 "Source Sans 3", "Source Sans Pro", "Segoe UI", system-ui, sans-serif;
  }
  main { width: 100%; max-width: 980px; }
  h1 { margin: 0 0 28px; font-weight: 600; font-size: 22px; letter-spacing: 0.08em; color: var(--muted); text-align: center; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 32px 24px 28px;
    color: var(--ink); text-decoration: none; background: var(--card);
    border: 2px solid var(--rule); border-radius: 20px; transition: border-color 0.2s, transform 0.2s;
  }
  .tile:hover { border-color: var(--accent-ink); transform: translateY(-2px); }
  .tile:focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 3px; }
  .pic { height: 190px; width: 100%; display: grid; place-items: center; }
  .pic img { max-height: 100%; max-width: 100%; }
  .pic svg { width: 100%; max-width: 300px; height: auto; }
  .name { font-weight: 700; font-size: 30px; line-height: 1.15; text-align: center; }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile:hover { transform: none; } }
</style>
</head>
<body>
<main>
  <h1>FS110</h1>
  <nav class="tiles" aria-label="Class tools">
    <a class="tile" href="bones/index.html" title="A 75-minute class: how do you know? Six dinosaur cases on a balance.">
      <span class="pic"><img class="ink-img" src="bones/img/bone.png" alt=""></span>
      <span class="name">Reasoning from Bones</span>
    </a>
    <a class="tile" href="sauropod/index.html" title="Drag a sauropod's head, heart and body; watch blood pressure, heart size and energy cost respond.">
      <span class="pic">
        <svg viewBox="0 0 146 80" aria-hidden="true">
          <path fill="var(--far)" d="M86 54 L88 73 L81 73 L79 55 Z M47 52 L46 73 L39 73 L40 53 Z"/>
          <path fill="currentColor" d="M2 50 C18 47 34 38 52 33 C66 29 82 28 94 30 C104 22 114 12 122 6 C126 3 134 1 139 4 C142 6 141 9 137 10 C131 11 124 19 116 30 C111 37 108 43 106 48 L106 74 L98 74 L96 57 C88 61 76 61 66 59 L64 74 L56 74 L53 57 C38 57 22 55 2 50 Z"/>
        </svg>
      </span>
      <span class="name">Sauropod neck posture</span>
    </a>
  </nav>
</main>
</body>
</html>
