<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanis</title>
<meta name="description" content="Fact cards from the Tanis site, weighed on one to three balances.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/tanis.css">
</head>
<body>
<h1 class="sr-only">Tanis</h1>
<main id="stage"></main>

<nav class="pics" aria-label="Images">
  <button type="button" data-src="img/fish.jpg" title="Fish (1)" aria-label="Fossil fish"><img src="img/fish.jpg" alt=""></button>
  <button type="button" data-src="img/map.jpg" title="Paleomap (2)" aria-label="Map of North America 66 million years ago"><img src="img/map.jpg" alt=""></button>
  <button type="button" data-src="img/site.jpg" title="Site (3)" aria-label="The Tanis site"><img src="img/site.jpg" alt=""></button>
</nav>
<div class="lightbox" hidden><img alt=""></div>

<nav class="ctl" aria-label="Board">
  <select id="add" title="Add a fact card by its number" aria-label="Add a fact card"></select>
  <button type="button" id="fewer" title="Remove the last balance (click twice if it is in use)" aria-label="Remove a balance"><svg viewBox="0 0 24 24"><path d="M10 5v13M5 20h10M3 8h14M3 8l-2 5a2 2 0 0 0 4 0zM17 8l-2 5a2 2 0 0 0 4 0z"/><path d="M18.5 3.5h5"/></svg></button>
  <button type="button" id="more" title="Add a balance" aria-label="Add a balance"><svg viewBox="0 0 24 24"><path d="M10 5v13M5 20h10M3 8h14M3 8l-2 5a2 2 0 0 0 4 0zM17 8l-2 5a2 2 0 0 0 4 0z"/><path d="M21 1v5M18.5 3.5h5"/></svg></button>
  <button type="button" id="theme" title="Whiteboard / chalkboard (T)" aria-label="Chalkboard"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="solid"/></svg></button>
  <button type="button" id="reset" title="Clear the board and all labels (click twice)" aria-label="Start over"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 3.5v4h4"/></svg></button>
</nav>
<div class="rotate" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="17" rx="2"/><path d="M20 15a8 8 0 0 1-6 6.5M16.5 21.5l-2.5 0 1-2.4"/></svg></div>

<noscript><p class="noscript">This page needs JavaScript.</p></noscript>
<script src="js/facts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
