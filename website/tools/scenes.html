<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scenes</title>
<!--
  Re-enactments of the GitHub, GitHub Desktop, Explorer/Finder and Notepad/TextEdit screens, played by a fake cursor.
  record.js opens this page as  scenes.html?scene=fork  (or &os=win / &os=mac), steps a fake clock, and turns the frames into gif/<scene>[-os].gif.
  Open it in a browser to watch a scene play in real time.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #555; }
  body { font: 14px/1.5 Inter, "Segoe UI", system-ui, sans-serif; color: #1f2328; }
  #stage { position: relative; width: 1000px; height: 625px; overflow: hidden; background: #fff; }
  #view { position: absolute; left: 0; top: 0; width: 1000px; height: 625px; transform-origin: 0 0; }
  #screen { position: absolute; inset: 0; }
  .abs { position: absolute; }
  .hide { display: none !important; }

  /* cursor, click ring, highlight box, caption, keys */
  #cursor { position: absolute; left: 0; top: 0; width: 22px; height: 30px; z-index: 50; pointer-events: none; }
  #ring { position: absolute; z-index: 49; border: 3px solid #f2b705; border-radius: 50%; pointer-events: none; }
  #hl { position: absolute; z-index: 48; border: 4px solid #f2b705; border-radius: 9px; box-shadow: 0 0 0 4000px rgba(0,0,0,0.0); pointer-events: none; }
  #cap {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 60; display: flex; align-items: center; gap: 16px;
    min-height: 66px; padding: 10px 22px; background: rgba(23, 33, 29, 0.94); color: #fff; font: 600 25px/1.25 Inter, sans-serif;
  }
  #cap .n { flex: none; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; background: #f2b705; color: #17211d; font-weight: 800; }
  #cap b { color: #f5d76e; }
  #keys { position: absolute; left: 50%; top: 42%; z-index: 61; transform: translate(-50%, -50%); display: flex; gap: 10px; align-items: center; font: 700 34px Inter, sans-serif; color: #fff; }
  #keys kbd { padding: 10px 22px; border-radius: 12px; background: #17211d; border: 3px solid #f2b705; font: inherit; }

  /* ---------- browser ---------- */
  .browser { position: absolute; inset: 0; display: flex; flex-direction: column; background: #fff; }
  .win .browser, .desk .browser { border-radius: 8px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.35); }
  .tabstrip { display: flex; align-items: flex-end; gap: 4px; height: 36px; padding: 0 10px; background: #dee1e6; }
  .tab { display: flex; align-items: center; gap: 8px; width: 230px; height: 30px; padding: 0 12px; border-radius: 8px 8px 0 0; background: #fff; font-size: 13px; white-space: nowrap; overflow: hidden; }
  .tab.off { background: transparent; color: #444; }
  .tab .fav { flex: none; width: 14px; height: 14px; border-radius: 50%; background: #1f2328; }
  .tab .fav.notes { border-radius: 3px; background: #fffdf7; border: 2px solid #333; border-left: 4px solid #c0392b; }
  .tab .x { margin-left: auto; color: #666; }
  .wc { margin-left: auto; display: flex; gap: 22px; align-self: center; color: #333; font-size: 13px; padding-right: 6px; }
  .lights { display: flex; gap: 8px; align-self: center; padding: 0 10px 0 4px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; } .lights i + i { background: #febc2e; } .lights i + i + i { background: #28c840; }
  .toolbar { display: flex; align-items: center; gap: 14px; height: 42px; padding: 0 12px; border-bottom: 1px solid #ddd; color: #555; font-size: 17px; }
  .url { flex: 1; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 14px; border-radius: 15px; background: #f1f3f4; color: #1f2328; font-size: 14px; }
  .url .lock { font-size: 11px; color: #555; }
  .page { position: relative; flex: 1; overflow: hidden; background: #fff; }

  /* ---------- GitHub look-alike ---------- */
  .gh-head { height: 92px; background: #f6f8fa; border-bottom: 1px solid #d1d9e0; padding: 12px 22px 0; }
  .gh-top { display: flex; align-items: center; gap: 14px; height: 34px; }
  .gh-ham { width: 32px; height: 32px; border: 1px solid #d1d9e0; border-radius: 6px; display: grid; place-items: center; color: #59636e; }
  .gh-logo { width: 32px; height: 32px; border-radius: 50%; background: #1f2328; }
  .gh-crumb { font-size: 14px; } .gh-crumb b { font-weight: 600; }
  .gh-search { margin-left: auto; width: 250px; height: 32px; border: 1px solid #d1d9e0; border-radius: 6px; padding: 5px 10px; color: #59636e; font-size: 13px; background: #fff; }
  .gh-av { width: 32px; height: 32px; border-radius: 50%; background: #8250df; color: #fff; display: grid; place-items: center; font-weight: 700; }
  .gh-tabs { display: flex; gap: 6px; margin-top: 10px; }
  .gh-tabs span { padding: 6px 10px 10px; font-size: 14px; color: #1f2328; border-bottom: 2px solid transparent; white-space: nowrap; }
  .gh-tabs span.on { border-bottom-color: #fd8c73; font-weight: 600; }
  .gh-tabs .ic { color: #59636e; margin-right: 6px; }
  .gh-main { padding: 20px 32px; }
  .gh-title { display: flex; align-items: center; gap: 10px; padding-bottom: 16px; border-bottom: 1px solid #d1d9e0; }
  .gh-title .av { width: 24px; height: 24px; border-radius: 50%; background: #1a7f37; }
  .gh-title .av.you { background: #8250df; }
  .gh-title h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .pill { padding: 0 8px; border: 1px solid #d1d9e0; border-radius: 12px; font-size: 12px; color: #59636e; }
  .gh-title .acts { margin-left: auto; display: flex; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid #d1d9e0; border-radius: 6px; background: #f6f8fa; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .btn .ct { padding: 0 6px; border-radius: 10px; background: #e8ebef; font-size: 12px; }
  .btn.green { background: #1f883d; border-color: #1a7f37; color: #fff; font-weight: 600; }
  .btn.dis { opacity: 0.5; }
  .forked { margin: -10px 0 12px 34px; font-size: 12px; color: #59636e; }
  .forked a { color: #0969da; }
  .gh-grid { display: grid; grid-template-columns: 1fr 250px; gap: 26px; margin-top: 18px; }
  .files { border: 1px solid #d1d9e0; border-radius: 6px; overflow: hidden; }
  .files .bar { display: flex; gap: 8px; padding: 10px 14px; }
  .files .bar .sp { flex: 1; }
  .files .row { display: flex; gap: 12px; padding: 9px 14px; border-top: 1px solid #d1d9e0; font-size: 14px; }
  .files .row .when { margin-left: auto; color: #59636e; }
  .files .row.head { background: #f6f8fa; color: #59636e; font-size: 13px; }
  .dir { color: #54aeff; } .doc { color: #59636e; }
  .about h3 { margin: 0 0 10px; font-size: 16px; } .about p { margin: 0; font-size: 14px; }

  .fork { width: 680px; margin: 26px auto; }
  .fork h2 { margin: 0 0 6px; font-size: 24px; font-weight: 400; }
  .fork p { margin: 0 0 10px; color: #59636e; font-size: 14px; }
  .fork hr { border: 0; border-top: 1px solid #d1d9e0; margin: 14px 0; }
  .lbl { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .field { height: 34px; border: 1px solid #d1d9e0; border-radius: 6px; padding: 6px 10px; font-size: 14px; background: #fff; white-space: pre; }
  .field.focus { border-color: #0969da; box-shadow: 0 0 0 2px #0969da; }
  .sel { background: #b6d7ff; }
  .caret { display: inline-block; width: 1.5px; height: 1.1em; vertical-align: -0.15em; background: #1f2328; margin-left: 1px; }
  .ok { color: #1a7f37; font-size: 13px; margin-top: 6px; }
  .check { display: inline-block; width: 15px; height: 15px; border-radius: 3px; background: #0969da; vertical-align: -2px; margin-right: 8px; color: #fff; font-size: 11px; line-height: 15px; text-align: center; }
  .check.off { background: #fff; border: 1px solid #59636e; }
  .note { padding: 10px 14px; border: 1px solid #d1d9e0; border-radius: 6px; font-size: 13px; color: #59636e; }

  .set { display: grid; grid-template-columns: 220px 1fr; gap: 28px; padding: 22px 32px; }
  .side div { padding: 5px 10px; border-radius: 6px; font-size: 14px; }
  .side .grp { margin-top: 12px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: #59636e; }
  .side .on { background: #eef1f4; font-weight: 600; box-shadow: inset 3px 0 0 #0969da; }
  .set h2 { margin: 0 0 8px; padding-bottom: 8px; border-bottom: 1px solid #d1d9e0; font-size: 24px; font-weight: 400; }
  .set h3 { margin: 18px 0 6px; font-size: 16px; font-weight: 600; }
  .set p { margin: 0 0 8px; color: #59636e; font-size: 14px; }
  .menu { position: absolute; z-index: 10; width: 250px; background: #fff; border: 1px solid #d1d9e0; border-radius: 12px; box-shadow: 0 8px 24px rgba(140,149,159,0.3); overflow: hidden; font-size: 14px; }
  .menu .mh { padding: 8px 14px; font-weight: 600; border-bottom: 1px solid #d1d9e0; }
  .menu .mi { padding: 7px 14px 7px 34px; position: relative; }
  .menu .mi.ck::before { content: "✓"; position: absolute; left: 13px; }
  .menu .mi.hov { background: #eef1f4; }
  .flash { padding: 14px 18px; border: 1px solid #54aeff66; background: #ddf4ff; border-radius: 6px; font-size: 14px; margin-bottom: 14px; }
  .live { display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px solid #d1d9e0; border-radius: 6px; background: #f6f8fa; margin: 6px 0 14px; }
  .live .t { font-size: 16px; } .live a { color: #0969da; } .live .sm { font-size: 12px; color: #59636e; }

  .act { display: grid; grid-template-columns: 220px 1fr; gap: 28px; padding: 22px 32px; }
  .act h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  .runs { border: 1px solid #d1d9e0; border-radius: 6px; margin-top: 14px; }
  .runs .rh { padding: 12px 16px; background: #f6f8fa; font-weight: 600; font-size: 14px; border-bottom: 1px solid #d1d9e0; }
  .run { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
  .run .st { width: 18px; height: 18px; border-radius: 50%; flex: none; }
  .run .st.go { border: 3px solid #bf8700; border-right-color: transparent; }
  .run .st.done { background: #1a7f37; color: #fff; font-size: 12px; text-align: center; line-height: 18px; font-weight: 700; }
  .run .nm { font-weight: 600; } .run .sub { font-size: 12px; color: #59636e; }
  .run .br { margin-left: auto; padding: 0 8px; border-radius: 6px; background: #ddf4ff; color: #0969da; font-size: 12px; font-family: "JetBrains Mono", monospace; }

  .auth { width: 460px; margin: 40px auto; text-align: center; }
  .auth .apps { display: flex; justify-content: center; gap: 18px; align-items: center; margin-bottom: 18px; }
  .auth .apps i { width: 64px; height: 64px; border-radius: 50%; background: #8250df; display: block; }
  .auth .apps i.d { background: #6f42c1; border-radius: 14px; }
  .auth h2 { font-size: 24px; font-weight: 400; margin: 0 0 18px; }
  .auth .box { border: 1px solid #d1d9e0; border-radius: 6px; padding: 18px; text-align: left; font-size: 14px; color: #59636e; }
  .prompt { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); width: 420px; padding: 18px; background: #fff; border-radius: 8px; box-shadow: 0 6px 30px rgba(0,0,0,0.35); font-size: 14px; z-index: 5; }
  .prompt b { display: block; font-size: 16px; margin-bottom: 6px; }
  .prompt .row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
  .prompt .pb { padding: 7px 16px; border-radius: 18px; border: 1px solid #ccc; }
  .prompt .pb.go { background: #0b57d0; color: #fff; border-color: #0b57d0; }

  .notesapp { position: absolute; inset: 0; background: center top / cover no-repeat; }

  /* ---------- desktop, windows ---------- */
  .desk { position: absolute; inset: 0; }
  .desk.win { background: linear-gradient(135deg, #1b4f8a, #4f8fd0 60%, #9ac3ea); }
  .desk.mac { background: linear-gradient(160deg, #3a2a68, #b0558f 55%, #f0a868); }
  .macbar { position: absolute; left: 0; right: 0; top: 0; height: 26px; display: flex; gap: 22px; align-items: center; padding: 0 18px; background: rgba(240,240,240,0.82); font-size: 13px; z-index: 20; }
  .macbar span:first-child { font-weight: 700; }
  .macbar span.open { background: #2f6fd8; color: #fff; border-radius: 4px; padding: 0 6px; margin: 0 -6px; }
  .taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: rgba(232,236,242,0.92); display: flex; justify-content: center; gap: 10px; align-items: center; z-index: 20; }
  .taskbar i { width: 26px; height: 26px; border-radius: 6px; background: #2a62c9; opacity: 0.85; }
  .taskbar i:nth-child(2) { background: #f2b705; } .taskbar i:nth-child(3) { background: #6f42c1; } .taskbar i:nth-child(4) { background: #1f883d; }
  .w { position: absolute; display: flex; flex-direction: column; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.38); }
  .tb { display: flex; align-items: center; height: 32px; padding: 0 10px; background: #f3f3f3; font-size: 12px; color: #333; flex: none; }
  .tb .ttl { flex: 1; text-align: center; }
  .desk.win .tb .ttl { text-align: left; padding-left: 4px; }
  .tb .wc { margin: 0; }
  .wbody { position: relative; flex: 1; overflow: hidden; }

  /* GitHub Desktop look-alike */
  .gd { background: #fff; }
  .gd .tb { background: #24292e; color: #fff; }
  .gd .gmenu { display: flex; gap: 16px; color: #e1e4e8; font-size: 12.5px; }
  .gd .gmenu span.open { background: #444d56; border-radius: 3px; padding: 0 5px; margin: 0 -5px; }
  .gd .gbar { display: flex; height: 52px; background: #24292e; color: #fff; flex: none; border-top: 1px solid #3a4048; }
  .gd .gbar > div { display: flex; flex-direction: column; justify-content: center; padding: 0 14px; border-right: 1px solid #141414; font-size: 13px; font-weight: 600; }
  .gd .gbar small { display: block; color: #9ba1a8; font-size: 11px; font-weight: 400; }
  .gd .gbar .repo { width: 260px; } .gd .gbar .branch { width: 230px; } .gd .gbar .fetch { width: 240px; }
  .gd .gbar .fetch.push { background: #2f363d; }
  .gd .gbar .up { display: inline-block; margin-left: 8px; padding: 0 6px; border-radius: 9px; background: #444d56; font-size: 11px; }
  .gd .cols { display: grid; grid-template-columns: 260px 1fr; height: 100%; }
  .gd .left { display: flex; flex-direction: column; border-right: 1px solid #e1e4e8; background: #fff; }
  .gd .ltabs { display: flex; border-bottom: 1px solid #e1e4e8; } .gd .ltabs span { flex: 1; text-align: center; padding: 8px; font-size: 13px; }
  .gd .ltabs span.on { box-shadow: inset 0 -3px #f9826c; font-weight: 600; }
  .gd .chg { padding: 6px 10px; font-size: 13px; border-bottom: 1px solid #e1e4e8; color: #586069; }
  .gd .file { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 13px; background: #f1f8ff; }
  .gd .file .m { margin-left: auto; width: 14px; height: 14px; border: 2px solid #d29922; border-radius: 3px; position: relative; }
  .gd .file .m::after { content: ""; position: absolute; left: 3px; top: 3px; width: 4px; height: 4px; border-radius: 50%; background: #d29922; }
  .gd .commit { margin-top: auto; padding: 10px; border-top: 1px solid #e1e4e8; background: #f6f8fa; }
  .gd .commit .field { height: 30px; font-size: 13px; margin-bottom: 6px; color: #1f2328; }
  .gd .commit .field.ph { color: #8b949e; }
  .gd .commit .desc { height: 64px; }
  .gd .bbtn { display: block; width: 100%; padding: 7px; border-radius: 5px; background: #0366d6; color: #fff; text-align: center; font-size: 13px; font-weight: 600; }
  .gd .bbtn.dis { opacity: 0.5; }
  .gd .right { position: relative; background: #fff; overflow: hidden; }
  .gd .empty { padding: 34px 40px; }
  .gd .empty h2 { margin: 0 0 18px; font-size: 22px; font-weight: 600; }
  .gd .card { display: flex; align-items: center; gap: 16px; padding: 14px 16px; margin-bottom: 10px; border: 1px solid #e1e4e8; border-radius: 6px; font-size: 13px; }
  .gd .card .tx { flex: 1; } .gd .card .tx b { display: block; font-size: 14px; }
  .gd .card .btn { height: 30px; font-size: 13px; }
  .gd .card .btn.blue { background: #0366d6; border-color: #0366d6; color: #fff; }
  .diffh { padding: 8px 14px; border-bottom: 1px solid #e1e4e8; font-size: 13px; font-weight: 600; }
  .diff { font: 13px/22px "JetBrains Mono", monospace; }
  .diff div { display: flex; white-space: pre; } .diff span.ln { width: 44px; padding-right: 8px; text-align: right; color: #959da5; flex: none; }
  .diff .h { background: #f1f8ff; color: #586069; } .diff .del { background: #ffeef0; } .diff .add { background: #e6ffed; }
  .welcome { display: grid; place-items: center; height: 100%; background: #fff; }
  .welcome .in { width: 460px; }
  .welcome h1 { margin: 0 0 10px; font-size: 26px; font-weight: 300; }
  .welcome p { color: #586069; font-size: 14px; }
  .welcome .bbtn { margin: 14px 0 8px; padding: 10px; font-size: 14px; }
  .welcome .lnk { color: #0366d6; font-size: 13px; margin: 6px 0; }
  .welcome .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .start { display: grid; grid-template-columns: 1fr 330px; height: 100%; }
  .start .l { padding: 40px; } .start .l h1 { margin: 0 0 8px; font-size: 26px; font-weight: 300; }
  .start .l .opt { padding: 10px 14px; margin: 8px 0; border: 1px solid #e1e4e8; border-radius: 6px; font-size: 13px; }
  .start .r { border-left: 1px solid #e1e4e8; display: flex; flex-direction: column; background: #f6f8fa; }
  .start .r .rh { padding: 12px 16px; font-weight: 600; font-size: 14px; border-bottom: 1px solid #e1e4e8; }
  .start .r .ri { padding: 8px 16px; font-size: 13px; } .start .r .ri.on { background: #0366d6; color: #fff; }
  .start .r .bbtn { margin: auto 14px 14px; width: auto; }
  .dlg { position: absolute; z-index: 8; background: #fff; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,0.4); font-size: 13px; overflow: hidden; }
  .dlg .dh { padding: 12px 16px; font-weight: 600; font-size: 15px; border-bottom: 1px solid #e1e4e8; }
  .dlg .db { padding: 14px 16px; }
  .dlg .df { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid #e1e4e8; background: #f6f8fa; }
  .dlg .df .btn { height: 30px; font-size: 13px; } .dlg .df .btn.blue { background: #0366d6; border-color: #0366d6; color: #fff; }
  .prog { height: 8px; border-radius: 4px; background: #e1e4e8; overflow: hidden; } .prog i { display: block; height: 100%; background: #0366d6; }

  /* Explorer / Finder */
  .ex .exbar { display: flex; gap: 8px; align-items: center; padding: 6px 12px; border-bottom: 1px solid #e5e5e5; font-size: 13px; color: #333; }
  .ex .exbar .path { flex: 1; padding: 4px 10px; border: 1px solid #ddd; border-radius: 4px; }
  .ex .exmain { display: grid; grid-template-columns: 170px 1fr; height: 100%; }
  .ex .nav { padding: 10px; font-size: 13px; color: #333; background: #fafafa; border-right: 1px solid #eee; }
  .ex .nav div { padding: 4px 8px; } .ex .nav .h { color: #888; font-size: 11px; font-weight: 600; margin-top: 6px; }
  .ex .nav .on { background: #e5e5e5; border-radius: 5px; }
  .ex .list { font-size: 13px; }
  .ex .list div { display: grid; grid-template-columns: 1fr 150px 130px; padding: 5px 12px; }
  .ex .list .lh { color: #666; border-bottom: 1px solid #eee; }
  .ex .list .on { background: #cce4f7; }
  .ex.narrow .exmain { grid-template-columns: 1fr; } .ex.narrow .nav { display: none; }
  .ex.narrow .list div { grid-template-columns: 1fr 70px; } .ex.narrow .list div span:last-child { display: none; }
  .desk.mac .ex .list .on { background: #2f6fd8; color: #fff; }
  .ico { display: inline-block; width: 14px; height: 12px; margin-right: 8px; border-radius: 2px; background: #e8b931; vertical-align: -1px; }
  .ico.f { background: #fff; border: 1px solid #888; height: 14px; width: 12px; }
  .ico.z { background: repeating-linear-gradient(90deg, #e8b931 0 5px, #8a6100 5px 7px); }
  .desk.mac .ico.z { background: repeating-linear-gradient(90deg, #ccc 0 5px, #777 5px 7px); }
  #ghost { position: absolute; z-index: 51; padding: 6px 12px; border-radius: 6px; background: rgba(47,111,216,0.92); color: #fff; font-size: 13px; font-weight: 600; pointer-events: none; }
  .ghmenu { position: absolute; z-index: 10; width: 300px; background: #fff; border: 1px solid #d1d9e0; border-radius: 12px; box-shadow: 0 8px 24px rgba(140,149,159,0.3); font-size: 14px; overflow: hidden; }

<body>
<div id="stage">
  <div id="view">
    <div id="screen"></div>
    <div id="hl" class="hide"></div>
    <div id="ring" class="hide"></div>
    <div id="ghost" class="hide"></div>
    <svg id="cursor" viewBox="0 0 22 30"><path d="M2 2 L2 24 L8 18.5 L12 27.5 L16 25.8 L12 17 L20 17 Z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>
  <div id="keys" class="hide"></div>
  <div id="cap" class="hide"><span class="n"></span><span class="t"></span></div>
</div>
<script>
'use strict';
const P = new URLSearchParams(location.search);
const SCENE = P.get('scene') || 'fork';
const OS = P.get('os') === 'mac' ? 'mac' : 'win';
const U = 'yourname';
const SITE = U + '.github.io';
const W = 1000, H = 625;
const $ = s => document.querySelector(s);
const view = $('#view'), screenEl = $('#screen'), cursorEl = $('#cursor'), ring = $('#ring'), hl = $('#hl');

/* ---------- timing: everything runs on setTimeout / requestAnimationFrame so the recorder's fake clock drives it ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
const ease = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
function tween(ms, f) {

    const t0 = performance.now();

    })();

/* ---------- camera ---------- */
let cam = { s: 1, x: 0, y: 0 };
function applyCam() { view.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`; }
function camFor(r, s) {
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  let x = W / 2 - cx * s, y = (H - 66) / 2 - cy * s;
  x = Math.min(0, Math.max(W - W * s, x)); y = Math.min(0, Math.max(H - 66 - H * s, y));

  const from = { ...cam };
  await tween(ms, k => { cam = { s: from.s + (to.s - from.s) * k, x: from.x + (to.x - from.x) * k, y: from.y + (to.y - from.y) * k }; applyCam(); });
}
const unzoom = (ms) => zoom(null, 1, ms);

/* rect of an element in view coordinates (before the camera) */
function rect(target) {

  return { x: (r.left - v.left - cam.x) / cam.s, y: (r.top - v.top - cam.y) / cam.s, w: r.width / cam.s, h: r.height / cam.s };
}

/* ---------- cursor ---------- */
let cur = { x: 640, y: 420 };
function placeCursor() {

  await tween(ms, k => { cur = { x: from.x + (to.x - from.x) * k, y: from.y + (to.y - from.y) * k }; placeCursor(); });
}

}

}
async function keys(...ks) {
  const k = $('#keys');

  k.classList.remove('hide');
  await wait(1300);
  k.classList.add('hide');

/* ---------- caption ---------- */
function cap(n, html) {

  c.querySelector('.n').style.display = n ? '' : 'none';
  c.querySelector('.t').innerHTML = html;
}

function show(html) { screenEl.innerHTML = html; }
/* scroll the browser page so the target sits mid-window */
async function scrollTo(target, ms = 700) {
  const pg = $('#page'), from = pg.scrollTop;
  const by = rect(target).y - rect(pg).y - pg.clientHeight * 0.45;
  await tween(ms, k => { pg.scrollTop = from + by * k; });

function desk(inner, app) {

const FETCH = { fetching: '<span>⟳ Fetching origin…</span><small>Hang on…</small>', publish: '<span>↑ Publish branch</span><small>Publish this branch to GitHub</small>',

const SHOW_IN = OS === 'mac' ? 'Show in Finder' : 'Show in Explorer';

    <div class="commit"><div class="field ph">Summary (required)</div><div class="field ph desc">Description</div><span class="bbtn dis">Commit to main</span></div></div>

      <div class="card"><div class="tx"><b>Open the repository page on GitHub in your browser</b>Repository menu or ${OS === 'mac' ? '⇧⌘G' : 'Ctrl+Shift+G'}</div><span class="btn">View on GitHub</span></div>

}
const LINES = ['<!doctype html>', '<html lang="en">', '<head>', '  <meta charset="utf-8">', '  <meta name="viewport" content="width=device-width, initial-scale=1">',
  '  <title>@</title>', '    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\'', '  <link rel="preconnect" href="https://fonts.googleapis.com">',
  '  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>', '  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=S',

function folder({ title, path, nav = 'Documents', rows, style, id = 'exwin', sel, narrow }) {
